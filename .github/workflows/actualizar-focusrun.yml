name: Actualizar Focus Run

# Día 1 de cada mes, 8:00 (Ciudad de México) = 14:00 UTC.
# Toma el resumen agregado del SAP Notes Control Center y reescribe la
# sección "Remediación de Vulnerabilidades en Focus Run" de index.html.
on:
  schedule:
    - cron: '0 14 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: actualizar-focusrun
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descargar resumen del SAP Notes Control Center
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X POST "https://ugywwrrxgktihqnldfho.supabase.co/rest/v1/rpc/focusrun_resumen" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}' -o "$RUNNER_TEMP/resumen.json"

      - name: Actualizar index.html
        run: python3 scripts/actualizar_focusrun.py index.html "$RUNNER_TEMP/resumen.json"

      - name: Guardar cambios
        id: cambios
        run: |
          if git diff --quiet; then echo "Sin cambios"; echo "hay=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Focus Run: actualización mensual $(date -u +%Y-%m-%d)"
          git push
          echo "hay=1" >> "$GITHUB_OUTPUT"

      - name: Publicar en GitHub Pages
        if: steps.cambios.outputs.hay == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/pages/builds
